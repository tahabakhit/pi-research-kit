name: Sync domain work tracking
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply reviewed enrollment and board changes (false is dry-run)
        type: boolean
        default: false
      verify_issue_write:
        description: Add a private credential-verification comment to the rollout receipt
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: domain-work-tracking
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require existing hosted project credential
        env:
          GH_TOKEN: ${{ secrets.PI_PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Work tracking requires the existing Projects-capable credential.'
            exit 1
          fi
      - name: Check out private canonical automation
        uses: actions/checkout@v7
        with:
          repository: tahabakhit/work-tracking
          token: ${{ secrets.PI_PROJECT_TOKEN }}
          persist-credentials: false
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit and synchronize without disclosing private data
        env:
          GH_TOKEN: ${{ secrets.PI_PROJECT_TOKEN }}
          APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && 'true' || 'false' }}
          VERIFY_WRITE: ${{ inputs.verify_issue_write && 'true' || 'false' }}
        run: |
          set -eu
          if [ "$APPLY" = 'true' ]; then
            python3 -m tracking audit-remote --apply
            python3 -m tracking sync --apply
          else
            python3 -m tracking audit-remote
            python3 -m tracking sync
          fi
          if [ "$VERIFY_WRITE" = 'true' ]; then
            python3 -m tracking verify-access --issue 1 --apply
          fi
          echo 'Private work-tracking audit and reconciliation completed; logs contain counts only.' >> "$GITHUB_STEP_SUMMARY"
